<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:16px;box-sizing:border-box}
.ramp{display:flex;border-radius:10px;overflow:hidden;border:1px solid var(--border-subtle)}
.ramp div{flex:1;height:60px;position:relative}
.mark{position:absolute;left:0;right:0;bottom:5px;text-align:center;color:#fff;font:700 8.5px var(--font-label);letter-spacing:.08em}
.lbls{display:flex;margin-top:7px}
.lbls div{flex:1;text-align:center;font-family:var(--font-label);font-size:9px;color:var(--gray-500);line-height:1.5}
.lbls b{display:block;font-weight:700;color:var(--ink-900);font-size:10px}
</style></head><body>
<div class="ramp"><div style="background:var(--gray-0)"></div><div style="background:var(--gray-50)"></div><div style="background:var(--gray-100)"></div><div style="background:var(--gray-200)"></div><div style="background:var(--gray-300)"></div><div style="background:var(--gray-400)"></div><div style="background:var(--gray-500)"></div><div style="background:var(--gray-600)"></div><div style="background:var(--gray-700)"></div><div style="background:var(--gray-800)"></div><div style="background:var(--gray-900)"></div><div style="background:var(--ink-900)"><span class="mark">INK</span></div></div>
<div class="lbls"><div><b>0</b>FFFFFF</div><div><b>50</b>F7F5FB</div><div><b>100</b>EFEBF6</div><div><b>200</b>E1DCEC</div><div><b>300</b>CBC4DB</div><div><b>400</b>A69DBC</div><div><b>500</b>82789D</div><div><b>600</b>645B7D</div><div><b>700</b>4B4363</div><div><b>800</b>332C4B</div><div><b>900</b>201A36</div><div><b>ink</b>171029</div></div>
</body></html>
