<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:18px 22px;box-sizing:border-box;display:flex;align-items:center;gap:26px}
.big{font-family:var(--font-label);font-weight:700;font-size:34px;letter-spacing:-.015em;color:var(--text-primary);font-variant-numeric:tabular-nums}
.big em{font-style:normal;color:var(--violet-600)}
.use{display:flex;flex-direction:column;gap:7px}
.use span{font-family:var(--font-label);font-size:11px;color:var(--gray-600)}
.chip{display:inline-flex;width:max-content;align-items:center;height:22px;padding:0 10px;border-radius:6px;background:var(--surface-sunken);color:var(--gray-700);font:500 11px var(--font-label);letter-spacing:.07em}
</style></head><body>
<div class="big">0123456789<em>→</em></div>
<div class="use"><span class="chip">MEMBERS · 2,400</span><span class="chip">SINCE 2024 · SF/SH</span><span>Caps + 0.07em tracking for labels; 500 for captions, 700 for big stats; tabular-nums on anything that counts.</span></div>
</body></html>
