<!-- @dsCard group="Brand" viewport="700x200" name="Data by hand" subtitle="Hatched strokes compare shares — no pies, no gridlines" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:22px 24px;box-sizing:border-box;background:var(--surface-card);display:flex;gap:34px;align-items:center}
.set{display:flex;flex-direction:column;gap:16px;flex:1}
.u{display:flex;flex-direction:column;gap:7px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:14px}
.l{font:600 10px var(--font-label);letter-spacing:.07em;text-transform:uppercase;color:var(--gray-600)}
.v{font:400 19px var(--font-hand);color:var(--gray-700)}
.row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.row b{width:4px;height:24px;border-radius:3px;background:var(--gray-200)}
.meta{font:500 9.5px var(--font-label);letter-spacing:.05em;color:var(--gray-600);line-height:1.8;width:112px}
</style></head><body>
<div class="set" id="set"></div>
<p class="meta">HATCHED STROKES FOR SHARES · HAND FIGURES IN LACQUER · NO PIE CHARTS, NO GRIDLINES, NO AXES</p>
<script>
const T=[-14,-19,-12,-17,-15,-21,-13,-18,-16,-20],J=[0,1.5,-1,2,0,-1.5,1,-2,.5,-.5];
const bar=(label,figure,on,ticks,color)=>{
  let h=`<div class="u"><div class="top"><span class="l">${label}</span><span class="v">${figure}</span></div><div class="row">`;
  for(let i=0;i<ticks;i++)h+=`<b style="transform:rotate(${T[i%T.length]}deg) translateY(${J[i%J.length]*.6}px);height:${24-Math.abs(J[i%J.length])}px${i<on?';background:'+color:''}"></b>`;
  return h+'</div></div>';
};
document.getElementById('set').innerHTML=
  bar('Seats claimed','62 / 100',22,36,'var(--brand-primary)')+
  bar('Members who host','41%',15,36,'var(--accent-cyan)')+
  bar('Replies under an hour','88%',32,36,'var(--accent-orange)');
</script>
</body></html>
