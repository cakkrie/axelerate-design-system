<!-- @dsCard group="Effects" viewport="700x170" name="Paper shadows" subtitle="Three flat offsets — nothing in this system blurs" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:22px 24px;box-sizing:border-box;display:flex;gap:26px;align-items:center;background:var(--surface-card)}
.t{flex:1;display:flex;flex-direction:column;gap:10px;align-items:center}
.sq{width:100%;height:78px;background:var(--surface-card);border-radius:var(--radius-hand)}
.t i{font-style:normal;font:500 9.5px var(--font-label);letter-spacing:.04em;color:var(--gray-600);text-align:center;line-height:1.6}
.t b{display:block;font-weight:700;color:var(--ink-900);font-size:11px;letter-spacing:.05em}
.note{width:116px;flex:none;margin-left:auto;font:600 15px var(--font-hand);color:var(--gray-600);line-height:1.35}
</style></head><body>
<div class="t"><span class="sq" style="box-shadow:var(--shadow-paper-inset)"></span><i><b>INSET · 2×2</b>fields, chips</i></div>
<div class="t"><span class="sq" style="box-shadow:var(--sticker-cut),var(--shadow-paper)"></span><i><b>PAPER · 2×3</b>cards, notes, stickers</i></div>
<div class="t"><span class="sq" style="box-shadow:var(--sticker-cut),var(--shadow-paper-lg)"></span><i><b>PAPER LG · 4×6</b>hover, toasts, dialogs</i></div>
<div class="t"><span class="sq" style="box-shadow:var(--shadow-hand);box-shadow:var(--shadow-hand)"></span><i><b>HAND · violet 3×4</b>brand moments only</i></div>
<p class="note">flat offsets only — never a blur</p>
</body></html>
