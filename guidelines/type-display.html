<!-- @dsCard group="Type" viewport="700x210" name="Display · Bricolage Grotesque" subtitle="Headlines & numbers with character. Google-hosted stand-in." -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:20px 22px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-family:var(--font-display);font-size:44px;font-weight:800;letter-spacing:var(--tracking-tighter);line-height:var(--leading-tight);color:var(--text-primary)}
h1 em{font-style:normal;background:var(--scribble-butter) no-repeat left bottom/100% 9px;padding-bottom:5px}
.w{display:flex;gap:22px;align-items:baseline;font-family:var(--font-display);color:var(--text-primary)}
.w span{font-size:26px}
.w i{display:block;font-style:normal;font:400 9.5px var(--font-label);color:var(--gray-500);margin-top:2px}
.meta{font:400 11px var(--font-label);color:var(--gray-500)}
</style></head><body>
<h1>Move together, <em>move faster</em>.</h1>
<div class="w"><span style="font-weight:300">Aa<i>300 light</i></span><span style="font-weight:400">Aa<i>400 regular</i></span><span style="font-weight:600">Aa<i>600 semibold</i></span><span style="font-weight:700">Aa<i>700 bold</i></span><span style="font-weight:800">Aa<i>800 extrabold</i></span></div>
<p class="meta">--font-display · headlines ≥22px · weight 700–800 · tracking −0.035em · butter scribble under ONE phrase max</p>
</body></html>
