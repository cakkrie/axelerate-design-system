<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:16px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;flex:1}
.t{flex:1;border-radius:12px;display:flex;align-items:center;justify-content:center}
.wm{font-family:var(--font-display);font-weight:800;font-size:30px;letter-spacing:-.04em;line-height:1}
.cap{font:400 10.5px var(--font-body);color:var(--text-muted);text-align:center}
</style></head><body>
<div class="row">
<div class="t" style="background:var(--surface-card);border:1px solid var(--border-subtle)"><span class="wm" style="color:var(--violet-600)">axelerate</span></div>
<div class="t" style="background:var(--violet-600)"><span class="wm" style="color:#fff">axelerate</span></div>
</div>
<p class="cap">Always lowercase, extrabold, −0.04em. Violet on light · white on violet. Never letterspaced, outlined, or gradient-filled.</p>
</body></html>
