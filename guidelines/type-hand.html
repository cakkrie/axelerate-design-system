<!-- @dsCard group="Type" viewport="700x160" name="Annotation · Lacquer" subtitle="The margin voice — never for UI labels" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:20px 22px;box-sizing:border-box;display:flex;align-items:center;gap:30px}
.big{font-family:var(--font-hand);font-weight:600;font-size:34px;color:var(--violet-700);transform:rotate(-2deg)}
.use{display:flex;flex-direction:column;gap:6px;font:400 11px var(--font-body);color:var(--text-secondary);line-height:1.5}
.use b{color:var(--text-primary)}
.ex{font-family:var(--font-hand);font-size:19px;color:var(--gray-700)}
</style></head><body>
<div class="big">takes 2 min, promise →</div>
<div class="use">
<span class="ex">← arrows, asides, "you are here"</span>
<span><b>18–34px, weight 500–600, violet-700 or gray-700, ±2–3° tilt.</b></span>
<span>For margin notes, doodled callouts, and sticker text only — never buttons, labels, or body copy.</span>
</div>
</body></html>
