<!-- @dsCard group="Spacing" viewport="700x250" name="Spacing tokens" subtitle="4px base, t-shirt names" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:18px 22px;box-sizing:border-box;display:flex;flex-direction:column;gap:9px}
.r{display:flex;align-items:center;gap:14px}
.r i{font-style:normal;flex:none;width:96px;font:400 10px var(--font-label);color:var(--gray-600)}
.r .bar{height:14px;border-radius:4px;background:var(--violet-300)}
.r b{font:700 10px var(--font-label);color:var(--violet-700)}
</style></head><body>
<div class="r"><i>--space-2xs</i><span class="bar" style="width:4px"></span><b>4</b></div>
<div class="r"><i>--space-xs</i><span class="bar" style="width:8px"></span><b>8</b></div>
<div class="r"><i>--space-sm</i><span class="bar" style="width:12px"></span><b>12</b></div>
<div class="r"><i>--space-md</i><span class="bar" style="width:16px"></span><b>16</b></div>
<div class="r"><i>--space-lg</i><span class="bar" style="width:24px"></span><b>24</b></div>
<div class="r"><i>--space-xl</i><span class="bar" style="width:32px"></span><b>32</b></div>
<div class="r"><i>--space-2xl</i><span class="bar" style="width:48px"></span><b>48</b></div>
<div class="r"><i>--space-3xl</i><span class="bar" style="width:64px"></span><b>64</b></div>
<div class="r"><i>--space-4xl</i><span class="bar" style="width:96px"></span><b>96</b></div>
</body></html>
