<!-- @dsCard group="Brand" viewport="700x230" name="Paper objects" subtitle="Folders fan, bubbles talk, notes annotate, stickers punctuate" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:22px;box-sizing:border-box;background:var(--surface-card);display:flex;gap:26px;align-items:center}
.fan{display:flex;align-items:flex-start}
.f{width:96px;height:118px;border-radius:4px 4px 10px 10px;box-shadow:var(--shadow-hand);position:relative;padding:12px 10px;box-sizing:border-box;font:700 12px var(--font-display);color:#fff}
.f::before{content:'';position:absolute;left:0;top:-12px;width:46%;height:14px;background:inherit;border-radius:6px 12px 0 0}
.bub{position:relative;background:var(--accent-cyan);color:var(--ink-900);padding:12px 15px;border-radius:20px 22px 19px 23px/22px 20px 23px 19px;font:400 13px var(--font-body);max-width:150px}
.bub::after{content:'';position:absolute;left:20px;bottom:-8px;width:16px;height:12px;background:var(--accent-cyan);clip-path:polygon(0 0,100% 0,18% 100%)}
.note{width:112px;background:var(--accent-yellow);padding:14px 12px;font:400 12px var(--font-body);color:var(--ink-900);clip-path:polygon(0 0,100% 0,100% 84%,84% 100%,0 100%);box-shadow:2px 3px 0 rgba(23,16,41,.1)}
.note b{display:block;font:600 19px var(--font-hand);margin-bottom:2px}
.stk{display:inline-flex;align-items:center;padding:7px 13px;border-radius:999px;background:var(--ink-900);color:var(--butter-400);font:700 12.5px var(--font-display);box-shadow:0 0 0 3px #fff,3px 4px 0 rgba(23,16,41,.14)}
.meta{font:500 9.5px var(--font-label);letter-spacing:.05em;color:var(--gray-600);line-height:1.8;width:108px;margin-left:auto}
</style></head><body>
<div class="fan">
<div class="f" style="background:var(--brand-primary);transform:rotate(-3deg)">brand</div>
<div class="f" style="background:var(--accent-cyan);color:var(--ink-900);margin-left:-14px;margin-top:8px;transform:rotate(2deg)">social</div>
<div class="f" style="background:var(--accent-orange);color:var(--ink-900);margin-left:-14px;transform:rotate(-1deg)">rooms</div>
</div>
<div class="bub">Two intros, one week.</div>
<div class="note"><b>bring a friend</b>hosts pick first</div>
<span class="stk">new</span>
<p class="meta">FANS OVERLAP −14PX · FOLDERS TILT ±1–4° · BUBBLES, NOTES, STICKERS STAY UPRIGHT · STICKERS KEEP THE WHITE KEYLINE</p>
</body></html>
