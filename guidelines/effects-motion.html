<!-- @dsCard group="Effects" viewport="700x180" name="Motion" subtitle="Launch ease — fast out, no bounce. Hover the buttons." -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:20px 22px;box-sizing:border-box;display:flex;gap:26px;align-items:center;background:var(--surface-card)}
.spec{display:flex;flex-direction:column;gap:8px}
.spec .n{font-family:var(--font-display);font-weight:700;font-size:17px;color:var(--text-primary)}
.spec i{font-style:normal;font:400 10px var(--font-label);color:var(--gray-600);line-height:1.7}
.d{display:flex;gap:8px}
.d span{font:400 9.5px var(--font-label);color:var(--violet-700);background:var(--violet-100);border-radius:5px;padding:2px 7px}
.demos{display:flex;gap:12px;margin-left:auto}
.btn{height:44px;padding:0 20px;border:none;border-radius:var(--radius-btn);display:inline-flex;align-items:center;font:700 14.5px var(--font-display);letter-spacing:-.01em;cursor:pointer;transition:transform var(--dur-fast) var(--ease-launch),box-shadow var(--dur-med) var(--ease-launch),background var(--dur-fast) var(--ease-launch),color var(--dur-fast)}
.p1{background:var(--brand-primary);color:#fff;box-shadow:var(--sticker-cut),var(--shadow-paper)}
.p1:hover{background:var(--brand-primary-strong);box-shadow:var(--sticker-cut),var(--shadow-paper-lg)}
.p1:active{transform:scale(.97)}
.p2{background:var(--surface-card);color:var(--ink-900);box-shadow:var(--sticker-cut),0 0 0 4px var(--gray-300),var(--shadow-paper)}
.p2:hover{color:var(--text-brand);box-shadow:var(--sticker-cut),0 0 0 4px var(--violet-400),var(--shadow-paper-lg)}
.p2:active{transform:scale(.97)}
</style></head><body>
<div class="spec"><span class="n">launch — cubic-bezier(.2, 0, 0, 1)</span><i>Everything accelerates out of the gate and glides in.<br>Hover deepens the sticker and grows its flat shadow · scale(.97) squish on press.<br>No bounces, no springs, no blurred glows, nothing over 320ms.</i><div class="d"><span>fast 120ms</span><span>med 200ms</span><span>slow 320ms</span></div></div>
<div class="demos"><button class="btn p1">Hover me</button><button class="btn p2">Press me</button></div>
</body></html>
