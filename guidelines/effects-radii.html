<!-- @dsCard group="Effects" viewport="700x170" name="Corner radii" subtitle="Three corner styles — hand, sketch, pill. Nothing else." -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:22px 24px;box-sizing:border-box;display:flex;gap:26px;align-items:center;background:var(--surface-card)}
.t{flex:1;display:flex;flex-direction:column;align-items:center;gap:10px}
.sq{width:100%;height:76px;background:var(--violet-100);box-shadow:inset 0 0 0 2px var(--violet-300)}
.t i{font-style:normal;font:500 9.5px var(--font-label);letter-spacing:.05em;color:var(--gray-600);text-align:center;line-height:1.6}
.t b{display:block;font-weight:700;color:var(--ink-900);font-size:11px;letter-spacing:.05em}
.note{width:120px;flex:none;margin-left:auto;font:600 15px var(--font-hand);color:var(--gray-600);line-height:1.35}
</style></head><body>
<div class="t"><span class="sq" style="border-radius:var(--radius-hand)"></span><i><b>HAND</b>cards, folders, notes,<br>inputs, dialogs (sm / lg scale)</i></div>
<div class="t"><span class="sq" style="border-radius:var(--radius-btn)"></span><i><b>SKETCH</b>buttons only</i></div>
<div class="t"><span class="sq" style="border-radius:var(--radius-pill)"></span><i><b>PILL</b>badges, icon buttons,<br>segmented switches</i></div>
<p class="note">no 4/8px scale — corners are drawn, not measured</p>
</body></html>
