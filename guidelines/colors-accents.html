<!-- @dsCard group="Colors" viewport="700x175" name="Accents" subtitle="Six hues — paper objects, never page backgrounds" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:20px 22px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;background:var(--surface-card)}
.row{display:flex;gap:0}
.s{flex:1;height:88px;padding:9px 10px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;box-sizing:border-box}
.s:first-child{border-radius:var(--radius-hand-sm);border-top-right-radius:0;border-bottom-right-radius:0}
.s:last-child{border-radius:var(--radius-hand-sm);border-top-left-radius:0;border-bottom-left-radius:0}
.s b{font:700 12px var(--font-display);letter-spacing:-.01em}
.s i{font-style:normal;font:500 8px var(--font-label);letter-spacing:.04em;opacity:.75}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.meta span{font:600 15px var(--font-hand);color:var(--gray-600)}
.meta u{text-decoration:none;font:500 9px var(--font-label);letter-spacing:.05em;color:var(--gray-500)}
</style></head><body>
<div class="row">
<div class="s" style="background:var(--accent-coral);color:var(--ink-900)"><b>Coral</b><i>F2542D</i></div>
<div class="s" style="background:var(--accent-orange);color:var(--ink-900)"><b>Orange</b><i>FF8A4C</i></div>
<div class="s" style="background:var(--accent-pink);color:var(--ink-900)"><b>Pink</b><i>DE5C96</i></div>
<div class="s" style="background:var(--accent-blush);color:var(--ink-900)"><b>Blush</b><i>F3A7C6</i></div>
<div class="s" style="background:var(--accent-lavender);color:var(--ink-900)"><b>Lavender</b><i>C4AEF7</i></div>
<div class="s" style="background:var(--accent-yellow);color:var(--ink-900)"><b>Yellow</b><i>FFC93C</i></div>
</div>
<div class="meta"><span>pick 2–3 per view · never next to a neighbour hue</span><u>INK ON ALL SIX AT TEXT SIZES · WHITE ONLY ON VIOLET</u></div>
</body></html>
