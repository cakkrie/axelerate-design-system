<!-- @dsCard group="Effects" viewport="700x180" name="Sticker & paper edges" subtitle="Die-cut keyline, flat offset, pencil line, punched hole" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:22px 24px;box-sizing:border-box;display:flex;gap:26px;align-items:center;background:var(--surface-card)}
.d{display:flex;flex-direction:column;align-items:center;gap:10px}
.d i{font-style:normal;font:600 16px var(--font-hand);color:var(--gray-600)}
.stk{padding:9px 16px;border-radius:var(--radius-btn);background:var(--brand-primary);color:#fff;font:700 14px var(--font-display);box-shadow:var(--sticker-cut),var(--shadow-paper)}
.out{padding:9px 16px;border-radius:var(--radius-btn);background:#fff;color:var(--ink-900);font:700 14px var(--font-display);box-shadow:var(--sticker-cut),0 0 0 4px var(--gray-300),var(--shadow-paper)}
.field{width:132px;height:40px;background:var(--surface-sunken);border-bottom:2px solid var(--pencil-line);border-radius:var(--radius-hand-sm) var(--radius-hand-sm) 3px 3px}
.field.on{background:#fff;border-bottom-color:var(--brand-primary);box-shadow:inset 0 -9px 0 var(--butter-200)}
.sheet{position:relative;width:118px;height:78px;background:#fff;border-radius:var(--radius-hand);box-shadow:var(--sticker-cut),var(--shadow-paper-lg)}
.sheet span{position:absolute;top:10px;left:16px;width:13px;height:13px;border-radius:50%;background:var(--surface-page);box-shadow:inset 1px 1px 0 rgba(23,16,41,.16)}
.sheet span+span{left:43px}
</style></head><body>
<div class="d"><span class="stk">sticker</span><i>keyline + flat drop</i></div>
<div class="d"><span class="out">outlined</span><i>4px pencil keyline</i></div>
<div class="d"><span class="field"></span><i>ruled field</i></div>
<div class="d"><span class="field on"></span><i>focus = volt swipe</i></div>
<div class="d"><span class="sheet"><span></span><span></span></span><i>punched sheet</i></div>
</body></html>
