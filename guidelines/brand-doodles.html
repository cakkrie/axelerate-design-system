<!-- @dsCard group="Brand" viewport="700x180" name="Doodles" subtitle="Abstract marker strokes in assets/doodles/ — 1–2 per view" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:20px 24px;box-sizing:border-box;display:flex;align-items:center;gap:30px;background:var(--surface-card)}
.lines{display:flex;flex-direction:column;gap:16px}
.line{font:800 20px var(--font-display);letter-spacing:-.02em;color:var(--ink-900);white-space:nowrap}
.line em{font-style:normal;padding:2px 13px;margin:0 -9px;background:url('../assets/doodles/circle-violet.svg') no-repeat center/100% 100%}
.line u{text-decoration:none;background:url('../assets/doodles/underline-butter.svg') no-repeat left bottom/100% 7px;padding-bottom:3px}
.line i{font-style:normal;display:block;margin-top:3px;font:400 9.5px var(--font-label);letter-spacing:.05em;color:var(--gray-500)}
.d{display:flex;flex-direction:column;align-items:center;gap:9px}
.d i{font-style:normal;font:400 9.5px var(--font-label);color:var(--gray-500)}
.meta{font:400 10px var(--font-label);color:var(--gray-500);line-height:1.8;max-width:150px;margin-left:auto}
</style></head><body>
<div class="lines">
<span class="line">Eight seats, <em>one topic</em>, zero lurkers.<i>CIRCLE-VIOLET.SVG · ONE PHRASE, INSIDE A LINE</i></span>
<span class="line">Ask before lunch, <u>call by Friday</u>.<i>UNDERLINE-BUTTER.SVG · UNDER ONE PHRASE, NOT A BLOCK</i></span>
</div>
<div class="d"><img src="../assets/doodles/arrow-violet.svg" alt="" style="width:44px;transform:rotate(-6deg)"><i>arrow-violet.svg</i></div>
<div class="d"><img src="../assets/doodles/sparkle-butter.svg" alt="" style="width:38px"><i>sparkle-butter.svg</i></div>
<p class="meta">VIOLET + BUTTER ONLY · ONE EMPHASIS DOODLE PER VIEW · NEVER AROUND A WHOLE HEADLINE OR BLOCK</p>
</body></html>
