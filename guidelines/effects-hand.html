<!-- @dsCard group="Effects" viewport="700x220" name="Hand-drawn kit" subtitle="Wobbly radii, ink lines, marker shadows, scribbles, stickers" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:20px 22px;box-sizing:border-box;display:flex;gap:18px;align-items:center}
.hc{width:170px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-hand);box-shadow:var(--shadow-hand);padding:16px}
.hc h4{margin:0 0 4px;font:700 15px var(--font-display);letter-spacing:-.01em}
.hc p{margin:0;font:400 12px/1.5 var(--font-body);color:var(--text-secondary)}
.dash{width:120px;height:104px;border:1.5px dashed var(--gray-300);border-radius:var(--radius-hand);display:flex;align-items:center;justify-content:center;font:400 11px var(--font-body);color:var(--text-muted);text-align:center}
.col{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.scr{font:800 22px var(--font-display);letter-spacing:-.02em}
.scr em{font-style:normal;background:var(--scribble-butter) no-repeat left bottom/100% 7px;padding-bottom:3px}
.stick{display:inline-flex;align-items:center;height:24px;padding:0 11px;border-radius:999px;background:var(--butter-300);color:var(--ink-900);font:600 12px var(--font-body)}
.note{font-family:var(--font-hand);font-size:22px;color:var(--violet-700)}
.meta{font:400 10px var(--font-label);color:var(--gray-500);line-height:1.7;max-width:150px}
</style></head><body>
<div class="hc"><h4>Wobbly card</h4><p>Quiet hairline, --radius-hand, marker shadow 3×4 — no ink box lines.</p></div>
<div class="dash">dashed =<br>outline variant</div>
<div class="col"><span class="scr">Scribble <em>this one</em></span><span class="stick">sticker</span><span class="note">← notes in Lacquer</span></div>
<p class="meta" style="max-width:130px">DOODLE FILES: ASSETS/DOODLES/ · LINES LIVE IN DOODLES + GRID, NOT BOXES</p>
</body></html>
