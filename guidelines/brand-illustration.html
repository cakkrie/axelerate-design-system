<!-- @dsCard group="Brand" viewport="700x210" name="Illustration system" subtitle="Ink line art + one accent blob — mini, spot, hero" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:20px 22px;box-sizing:border-box;display:flex;gap:22px;align-items:center;background:var(--surface-card)}
.f{position:relative;display:flex;align-items:center;justify-content:center;flex:none}
.blob{position:absolute;inset:12% 10% 14% 14%;background:var(--tint-lilac);border-radius:58% 42% 52% 48%/48% 55% 45% 52%;transform:rotate(-6deg)}
.g{position:relative;width:62%;height:62%;background:var(--ink-900);-webkit-mask:var(--u) center/contain no-repeat;mask:var(--u) center/contain no-repeat}
.slot{width:100%;height:100%;border:2px dashed var(--pencil-line);border-radius:var(--radius-hand);display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;box-sizing:border-box;font:600 15px var(--font-hand);color:var(--gray-600)}
.u{display:flex;flex-direction:column;align-items:center;gap:7px}
.u i{font-style:normal;font:600 9.5px var(--font-label);letter-spacing:.06em;text-transform:uppercase;color:var(--gray-500)}
.rules{font:600 15px var(--font-hand);color:var(--gray-600);line-height:1.45;width:150px;margin-left:auto}
</style></head><body>
<div class="u"><div class="f" style="width:86px;height:86px"><span class="blob"></span><span class="g" style="--u:url('../assets/icons/coffee-cup-2.svg')"></span></div><i>mini · 96</i></div>
<div class="u"><div class="f" style="width:150px;height:110px"><span class="slot">a small scene</span></div><i>spot · 220</i></div>
<div class="u"><div class="f" style="width:230px;height:126px"><span class="slot">one scene per page, top of the flow</span></div><i>hero · 520</i></div>
<p class="rules">ink lines only · one blob, tilted · never more than one hero</p>
</body></html>
