<!-- @dsCard group="Colors" viewport="700x150" name="Core" subtitle="One brand purple, paper, ink — everything else is accent or grey" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:20px 22px;box-sizing:border-box;display:flex;gap:0;align-items:stretch;background:var(--surface-card)}
.c{flex:1;height:100px;padding:12px 14px;display:flex;flex-direction:column;justify-content:flex-end;gap:3px;box-sizing:border-box}
.c:first-child{border-radius:var(--radius-hand-sm);border-top-right-radius:0;border-bottom-right-radius:0}
.c:last-child{border-radius:var(--radius-hand-sm);border-top-left-radius:0;border-bottom-left-radius:0}
.c b{font:700 14px var(--font-display);letter-spacing:-.01em}
.c i{font-style:normal;font:500 9px var(--font-label);letter-spacing:.05em;opacity:.8}
.note{width:126px;flex:none;margin-left:18px;align-self:center;font:600 15px var(--font-hand);color:var(--gray-600);line-height:1.35}
</style></head><body>
<div class="c" style="background:var(--violet-600);color:#fff"><b>Brand purple</b><i>6E2BEE · VIOLET-600</i></div>
<div class="c" style="background:var(--gray-0);color:var(--ink-900);box-shadow:inset 0 0 0 1px var(--gray-200)"><b>White</b><i>FFFFFF · THE GROUND</i></div>
<div class="c" style="background:var(--ink-900);color:#fff"><b>Ink</b><i>171029</i></div>
<p class="note">one purple, white ground, ink type — nothing else is core</p>
</body></html>
